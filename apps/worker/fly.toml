# fly launch --no-deploy --config apps/worker/fly.toml ; then: fly deploy --config apps/worker/fly.toml
app = "bookbridge-worker"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  WORKER_CONCURRENCY = "4"
  STORAGE_DRIVER = "supabase"

[[vm]]
  memory = "2gb"      # Chromium + sharp on 50-page batches
  cpus = 2

[checks]
  [checks.health]
    type = "http"
    port = 8080
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
